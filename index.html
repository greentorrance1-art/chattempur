  const groups = {};
  models.forEach(m => { if (!groups[m.line]) groups[m.line] = []; groups[m.line].push(m); });
  return lineOrder.filter(l => groups[l]).map(l => ({ line: l, items: groups[l] }));
}

            <div class="hero-cell-title">Percentage Step-Up</div>
            ${stepUpLabel}
          </div>
        </div>
      </div>

      <div class="detail-grid">
        <div class="detail-box">
          <div class="detail-box-title">Key Features</div>
          ${keysHtml}
        </div>
        <div class="detail-box">
          <div class="detail-box-title">Pricing by Size</div>
          ${sizesHtml}
          ${monthlyHtml}
        </div>
      </div>
      <div class="line-box" style="background:${lc}10; border-color:${lc};">
        <div class="line-box-title" style="color:${lc};">${m.line} Line</div>
        <div class="line-box-text">${lineDesc[m.line]}</div>
      </div>
      <div class="pitch-box" style="background:${pitchBg}; border-color:${pitchColor};">
        <div class="pitch-title" style="color:${pitchColor};">${pitchLabel}</div>
        <div class="pitch-text">${pitchText}</div>
        ${bridgeLine}
      </div>
    </div>
  </div>`;
}

function buildSection(models, isFloor) {
  return groupByLine(models).map(({ line, items }) => {
    const lc = lineColors[line] || "#0A1628";
    return `
      <div class="section-divider">
        <div class="divider-line" style="background:${lc}40;"></div>
        <span class="divider-label" style="color:${lc};">${line} Line</span>
        <div class="divider-line" style="background:${lc}40;"></div>
      </div>
      ${items.map(m => buildCard(m, isFloor)).join("")}`;
  }).join("");
}

document.getElementById("section-floor").innerHTML = buildSection(floorModels, true);
document.getElementById("section-prev").innerHTML = buildSection(prevGenModels, false);

function toggleCard(id) {
  const card = document.getElementById(id);
  const chevron = card.querySelector(".chevron");
  card.classList.toggle("open");
  chevron.textContent = card.classList.contains("open") ? "▲" : "▼";
}
function switchTab(tab, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("section-floor").style.display = tab === "floor" ? "block" : "none";
  document.getElementById("section-prev").style.display = tab === "prev" ? "block" : "none";
  document.getElementById("alert-floor").style.display = tab === "floor" ? "block" : "none";
  document.getElementById("alert-prev").style.display = tab === "prev" ? "block" : "none";
}
</script>
</body>
</html>
